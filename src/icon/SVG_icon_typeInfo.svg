       x="266.01758"
       y="78.636719"
       id="text29"><tspan
         sodipodi:role="line"
         id="tspan29"
         x="266.01758"
         y="78.636719">Instrucciones de exportación:</tspan><tspan
         sodipodi:role="line"
         x="266.01758"
         y="93.636719"
         id="tspan55" /><tspan
         sodipodi:role="line"
         x="266.01758"
         y="108.63672"
         id="tspan57">Exportar &gt; Exportar en lotes &gt; Páginas</tspan><tspan
         sodipodi:role="line"
         x="266.01758"
         y="123.63672"
         id="tspan1">Seleccionar todas las páginas (256px ... 16px)</tspan><tspan
         sodipodi:role="line"
         x="266.01758"
         y="138.63672"
         id="tspan58" /><tspan
         sodipodi:role="line"
         x="266.01758"
         y="153.63672"
         id="tspan56">nombre de archivo (preferiblemente que incluya la ruta de preparación o la de assets):</tspan><tspan
         sodipodi:role="line"
         x="266.01758"
         y="168.63672"
         id="tspan53">c:\Ruta\png_icon</tspan><tspan
         sodipodi:role="line"
         x="266.01758"
         y="183.63672"
         id="tspan31" /><tspan
         sodipodi:role="line"
         x="266.01758"
         y="198.63672"
         id="tspan16">En GIMP el lienzo debe ser de 256px.</tspan><tspan
         sodipodi:role="line"
         x="266.01758"
         y="213.63672"
         id="tspan14">Asegurarse que el primer archivo para abrir sea el de 256.</tspan><tspan
         sodipodi:role="line"
         x="266.01758"
         y="228.63672"
         id="tspan166">Organizar de mayor a menor las capas</tspan><tspan
         sodipodi:role="line"
         x="266.01758"
         y="243.63672"
         id="tspan164" /><tspan
         sodipodi:role="line"
         x="266.01758"
         y="258.63672"
         id="tspan165">Exportar desde GIMP a la carpeta build el .ico</tspan></text><path
